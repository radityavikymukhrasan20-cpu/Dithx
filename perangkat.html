<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perangkat Kelas</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#061322,#0b2747,#134d7a);
padding:20px;
color:white;
}


.container{
max-width:850px;
margin:auto;
}


h1{
text-align:center;
color:#00e5ff;
margin-bottom:30px;
}


/* AREA TOMBOL ADMIN */

.admin-area{

display:flex;

gap:15px;

margin-bottom:30px;

}


button{

padding:14px;

border:none;

border-radius:12px;

font-size:17px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}


button:hover{

transform:scale(1.03);

}


/* EDIT */

#editBtn{

display:none;

flex:1;

background:#00c853;

color:white;

}


#editBtn:hover{

background:#009624;

}



/* SIMPAN */

#saveBtn{

display:none;

flex:1;

background:#757575;

color:white;

}


#saveBtn:hover{

background:#616161;

}



/* TABEL */

table{

width:100%;

border-collapse:collapse;

background:#162b46;

border-radius:15px;

overflow:hidden;

}


th{

background:#00e5ff;

color:black;

padding:16px;

}


td{

padding:16px;

text-align:center;

border-bottom:1px solid #2b4d75;

}


tr:hover{

background:#203a5b;

}



/* KEMBALI */

.kembali{

width:100%;

margin-top:25px;

background:#00e5ff;

color:black;

}



/* NOTIF */

.toast{

position:fixed;

bottom:30px;

left:50%;

transform:translateX(-50%);

background:#00c853;

color:white;

padding:15px 25px;

border-radius:15px;

font-weight:bold;

opacity:0;

transition:.4s;

z-index:999;

}


.toast.show{

opacity:1;

bottom:50px;

}


</style>

</head>


<body>


<div class="container">


<h1>
👥 Perangkat Kelas X.3 TOI
</h1>



<div class="admin-area">


<button id="editBtn" onclick="editMode()">

✏️ Edit

</button>



<button id="saveBtn" onclick="simpanData()">

💾 Simpan

</button>


</div>




<table>


<tr>

<th>Jabatan</th>

<th>Nama</th>

</tr>


<tr>
<td>Wali Kelas</td>
<td contenteditable="false">....................</td>
</tr>


<tr>
<td>Ketua Kelas</td>
<td contenteditable="false">....................</td>
</tr>


<tr>
<td>Wakil Ketua</td>
<td contenteditable="false">....................</td>
</tr>


<tr>
<td>Sekretaris</td>
<td contenteditable="false">....................</td>
</tr>


<tr>
<td>Bendahara</td>
<td contenteditable="false">....................</td>
</tr>


<tr>
<td>Keamanan</td>
<td contenteditable="false">....................</td>
</tr>


</table>




<button class="kembali" onclick="window.location='index.html'">

⬅ Kembali ke Beranda

</button>



</div>



<div id="toast" class="toast"></div>



<script>


function notif(pesan){

let toast=document.getElementById("toast");

toast.innerHTML=pesan;

toast.className="toast show";


setTimeout(function(){

toast.className="toast";

},2500);

}





function editMode(){


document.querySelectorAll(
"table td:nth-child(2)"
).forEach(function(item){


item.contentEditable=true;


});


notif("✏️ Mode Edit Aktif");


}





function simpanData(){


let data=[];


document.querySelectorAll(
"table td:nth-child(2)"
).forEach(function(item){


item.contentEditable=false;


data.push(item.innerHTML);


});



localStorage.setItem(
"perangkat",
JSON.stringify(data)
);



notif("💾 Data berhasil disimpan");


}




window.onload=function(){



if(localStorage.getItem("adminLogin")=="true"){


document.getElementById("editBtn").style.display="block";

document.getElementById("saveBtn").style.display="block";


}




let data=JSON.parse(
localStorage.getItem("perangkat")
);



if(data){


document.querySelectorAll(
"table td:nth-child(2)"
).forEach(function(item,index){


item.innerHTML=data[index];


});


}



}



</script>


</body>

</html>
