<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Admin</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}


body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#061322,#0b2747,#134d7a);

}


.box{

background:white;

width:320px;

padding:30px;

border-radius:20px;

text-align:center;

box-shadow:0 0 20px rgba(0,229,255,.3);

}



h2{

margin-bottom:20px;

color:#0b2747;

}



input{

width:100%;

padding:12px;

margin-top:12px;

border-radius:10px;

border:1px solid #ccc;

font-size:16px;

}



button{

width:100%;

padding:14px;

margin-top:15px;

border:none;

border-radius:12px;

background:#e53935;

color:white;

font-size:17px;

font-weight:bold;

cursor:pointer;

}



button:hover{

background:#c62828;

}



.kembali{

background:#00e5ff;

color:black;

}



/* NOTIFIKASI */

.toast{

position:fixed;

bottom:30px;

left:50%;

transform:translateX(-50%);

background:#00c853;

color:white;

padding:15px 25px;

border-radius:15px;

font-weight:bold;

font-size:16px;

opacity:0;

pointer-events:none;

transition:.4s;

box-shadow:0 5px 20px rgba(0,0,0,.3);

z-index:999;

}


.toast.show{

opacity:1;

bottom:50px;

}


.toast.error{

background:#e53935;

}


</style>


</head>


<body>



<div class="box">


<h2>
🔐 Login Admin
</h2>



<input 
id="username"
placeholder="Username">



<input 
id="password"
type="password"
placeholder="Password">



<button onclick="login()">

MASUK

</button>



<button class="kembali" onclick="kembali()">

⬅ Kembali

</button>


</div>



<div id="toast" class="toast"></div>




<script>


function notif(pesan, tipe="success"){


let toast=document.getElementById("toast");


toast.innerHTML=pesan;


toast.className="toast show";



if(tipe=="error"){


toast.classList.add("error");


}



setTimeout(function(){


toast.className="toast";


},2500);



}





function login(){


let user=document.getElementById("username").value;


let pass=document.getElementById("password").value;



if(user=="admin" && pass=="2026103"){



let waktu=new Date().getTime();



localStorage.setItem(
"adminLogin",
"true"
);



localStorage.setItem(
"loginTime",
waktu
);



notif("✅ Login berhasil<br>Selamat datang Admin");



setTimeout(function(){


window.location="index.html";


},1500);



}



else{


notif("❌ Username atau password salah","error");


}



}





function kembali(){


window.location="index.html";


}



</script>


</body>

</html>
