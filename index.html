<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard X.3 TOI</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}


body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#061322,#0b2747,#134d7a);

}



.container{

width:90%;

max-width:450px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(15px);

padding:30px;

border-radius:20px;

text-align:center;

box-shadow:0 0 25px rgba(0,229,255,.3);

}



h1{

color:#00e5ff;

margin-bottom:10px;

}



h3{

color:white;

font-weight:400;

margin-bottom:30px;

}



.menu{

background:#00e5ff;

color:black;

padding:18px;

border-radius:15px;

margin-top:15px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



.menu:hover{

background:white;

}



button{

width:100%;

padding:15px;

margin-top:15px;

border:none;

border-radius:15px;

font-size:17px;

font-weight:bold;

cursor:pointer;

}



.login{

background:#e53935;

color:white;

}



.logout{

display:none;

background:#757575;

color:white;

}



.mode{

color:#ddd;

margin-top:20px;

font-size:14px;

}



/* TOAST */

.toast{

position:fixed;

bottom:30px;

left:50%;

transform:translateX(-50%);

background:#00c853;

color:white;

padding:15px 25px;

border-radius:15px;

font-weight:bold;

opacity:0;

transition:.4s;

z-index:999;

}



.toast.show{

opacity:1;

bottom:50px;

}



</style>


</head>


<body>



<div class="container">


<h1>
🏭 Dashboard X.3 TOI
</h1>


<h3>
Selamat Datang
</h3>



<div class="menu" onclick="window.location='perangkat.html'">

👥 Perangkat Kelas

</div>



<div class="menu" onclick="window.location='piket.html'">

🧹 Jadwal Piket

</div>



<div class="menu" onclick="window.location='pr.html'">

📚 Daftar PR

</div>




<button id="loginBtn" class="login" onclick="window.location='admin.html'">

🔐 Login Admin

</button>




<button id="logoutBtn" class="logout" onclick="logout()">

🚪 Logout Admin

</button>



<div class="mode" id="status">

👤 Mode Siswa

</div>



</div>



<div id="toast" class="toast"></div>



<script>


function notif(pesan){


let toast=document.getElementById("toast");


toast.innerHTML=pesan;


toast.className="toast show";


setTimeout(function(){


toast.className="toast";


},2500);


}





window.onload=function(){


if(localStorage.getItem("adminLogin")=="true"){


document.getElementById("loginBtn").style.display="none";


document.getElementById("logoutBtn").style.display="block";


document.getElementById("status").innerHTML="🟢 Admin Aktif";


}


}





function logout(){


localStorage.removeItem("adminLogin");


localStorage.removeItem("loginTime");



notif("🚪 Logout Admin berhasil");



setTimeout(function(){


location.reload();


},1500);



}



</script>



</body>

</html>
